<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QMC English · 30-Day Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e1116;
  --bg-elev: #161a22;
  --bg-elev-2: #1e242f;
  --line: #2a3140;
  --ink: #e8eaf0;
  --ink-dim: #9aa3b4;
  --ink-mute: #5f6877;
  --accent: #ff7849;
  --accent-dim: #b8512f;
  --pro: #4fc3a1;
  --warn: #ffb74d;
  --danger: #ef5350;
  --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 10% 10%, rgba(255,120,73,.06), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(79,195,161,.05), transparent 40%);
  pointer-events: none;
  z-index: 0;
}
.app { position: relative; z-index: 1; min-height: 100vh; }

/* HEADER */
header.top {
  border-bottom: 1px solid var(--line);
  padding: 18px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(14,17,22,.85);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 50;
}
.brand {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.02em;
  display: flex; align-items: baseline; gap: 10px;
}
.brand .dot { color: var(--accent); }
.brand .sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-mute);
  font-weight: 400;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.top-right { display: flex; gap: 14px; align-items: center; }
.icon-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  transition: all 0.15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--ink-dim); }

/* MAIN */
.main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 65px); }
@media (max-width: 880px) { .main { grid-template-columns: 1fr; } }

/* SIDEBAR */
aside.sidebar {
  border-right: 1px solid var(--line);
  padding: 24px 16px;
  background: var(--bg-elev);
  max-height: calc(100vh - 65px);
  overflow-y: auto;
  position: sticky; top: 65px;
}
@media (max-width: 880px) {
  aside.sidebar { position: relative; max-height: none; top: 0; }
}
.day-list { display: flex; flex-direction: column; gap: 4px; }
.day-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s;
  border: 1px solid transparent;
}
.day-item:hover { background: var(--bg-elev-2); }
.day-item.active {
  background: var(--bg-elev-2);
  border-color: var(--accent-dim);
}
.day-num {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  font-size: 13px;
  color: var(--ink-mute);
  min-width: 28px;
}
.day-item.active .day-num { color: var(--accent); }
.day-item.completed .day-num { color: var(--pro); }
.day-title {
  font-size: 13px;
  color: var(--ink-dim);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.day-item.active .day-title { color: var(--ink); }
.day-progress-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: var(--ink-mute);
}

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 18px 12px 10px;
}

/* CONTENT */
main.content {
  padding: 36px 48px;
  max-width: 920px;
}
@media (max-width: 880px) { main.content { padding: 24px 18px; } }

.day-header {
  margin-bottom: 32px;
}
.day-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.day-title-big {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 38px;
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
}
.day-meta {
  color: var(--ink-dim);
  font-size: 14px;
  display: flex; gap: 16px; flex-wrap: wrap;
}
.day-meta span::before { content: '·'; margin-right: 16px; color: var(--ink-mute); }
.day-meta span:first-child::before { display: none; }

/* BLOCK CARDS */
.block {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 22px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.block-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.block-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 4px 9px;
  border-radius: 4px;
  background: var(--bg-elev-2);
  color: var(--ink-dim);
}
.block-tag.shadow { color: #ffd180; background: rgba(255, 183, 77, 0.1); }
.block-tag.dictation { color: #80d8ff; background: rgba(79, 195, 247, 0.1); }
.block-tag.persona { color: #ff8a80; background: rgba(255, 138, 128, 0.1); }
.block-title {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 20px;
  flex: 1;
  letter-spacing: -0.01em;
}
.block-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-mute);
}
.block-body { padding: 22px; }

/* SHADOW: lines */
.shadow-line {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  margin-bottom: 6px;
  transition: background 0.1s;
}
.shadow-line:hover { background: var(--bg-elev-2); }
.shadow-line.current { background: rgba(255,120,73,.08); border-left: 2px solid var(--accent); }
.shadow-en {
  font-size: 16px;
  color: var(--ink);
  font-weight: 500;
}
.shadow-zh {
  font-size: 13px;
  color: var(--ink-mute);
  margin-top: 4px;
}
.shadow-controls {
  display: flex;
  gap: 6px;
  align-items: flex-start;
}
.mini-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-dim);
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  transition: all 0.12s;
}
.mini-btn:hover { color: var(--accent); border-color: var(--accent); }
.mini-btn.recording { color: var(--danger); border-color: var(--danger); animation: pulse 1.5s ease infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.action-row {
  display: flex;
  gap: 10px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg-elev-2);
  color: var(--ink);
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 500;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.12s;
}
.btn:hover { background: var(--bg-elev); border-color: var(--ink-mute); }
.btn.primary {
  background: var(--accent);
  color: #1a0d05;
  border-color: var(--accent);
  font-weight: 600;
}
.btn.primary:hover { background: #ff8a5f; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* DICTATION */
.dictation-display {
  background: var(--bg-elev-2);
  border-radius: 10px;
  padding: 22px;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 16px;
  min-height: 80px;
  font-family: 'Fraunces', serif;
}
.dictation-display.hidden-text {
  color: transparent;
  background:
    repeating-linear-gradient(
      45deg,
      var(--bg-elev-2),
      var(--bg-elev-2) 10px,
      var(--bg-elev) 10px,
      var(--bg-elev) 20px
    );
  user-select: none;
}
.dictation-input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  padding: 14px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  resize: vertical;
  min-height: 90px;
}
.dictation-input:focus { outline: none; border-color: var(--accent); }
.dictation-result {
  margin-top: 14px;
  padding: 14px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  border-left: 3px solid var(--pro);
  white-space: pre-wrap;
  display: none;
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.7;
}
.dictation-result.show { display: block; }
.diff-correct { color: var(--ink); }
.diff-wrong { color: var(--danger); text-decoration: line-through; }
.diff-missing { color: var(--warn); background: rgba(255,183,77,0.1); padding: 0 3px; border-radius: 2px; }

/* PERSONA */
.persona-card {
  background: linear-gradient(135deg, rgba(255,138,128,0.06), transparent);
  border: 1px solid rgba(255,138,128,0.2);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 16px;
}
.persona-row { margin-bottom: 10px; }
.persona-row:last-child { margin-bottom: 0; }
.persona-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 3px;
}
.persona-value { font-size: 14px; color: var(--ink); }
.persona-opening {
  font-family: 'Fraunces', serif;
  font-size: 17px;
  font-style: italic;
  color: #ff8a80;
  background: rgba(255,138,128,0.08);
  padding: 14px 18px;
  border-radius: 8px;
  border-left: 3px solid #ff8a80;
  margin-top: 12px;
}

/* CHAT */
.chat-area {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  max-height: 460px;
  overflow-y: auto;
  padding: 16px;
  margin-top: 12px;
}
.chat-msg {
  margin-bottom: 14px;
  display: flex;
  gap: 10px;
}
.chat-msg .who {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  min-width: 60px;
  padding-top: 6px;
}
.chat-msg.ai .who { color: #ff8a80; }
.chat-msg.you .who { color: var(--pro); }
.chat-msg.system .who { color: var(--ink-mute); }
.chat-bubble {
  background: var(--bg-elev);
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 15px;
  flex: 1;
  line-height: 1.5;
}
.chat-msg.ai .chat-bubble { background: rgba(255,138,128,0.07); }
.chat-msg.you .chat-bubble { background: rgba(79,195,161,0.07); }
.chat-msg.system .chat-bubble {
  background: transparent;
  font-style: italic;
  color: var(--ink-mute);
  font-size: 13px;
  padding: 4px 0;
}

.chat-input-row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.chat-input-row textarea {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 8px;
  resize: none;
  min-height: 44px;
  max-height: 120px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
}
.chat-input-row textarea:focus { outline: none; border-color: var(--accent); }
.chat-status {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 8px;
}

/* SETTINGS modal */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.7);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(4px);
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  width: 90%;
  max-width: 540px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal h2 {
  font-family: 'Fraunces', serif;
  font-weight: 700;
  font-size: 24px;
  margin-bottom: 18px;
}
.modal label {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-bottom: 6px;
  margin-top: 16px;
}
.modal input[type="password"],
.modal input[type="text"],
.modal select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 12px;
  border-radius: 7px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
.modal .hint {
  font-size: 12px;
  color: var(--ink-mute);
  margin-top: 6px;
  line-height: 1.5;
}
.modal-actions {
  display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end;
}

/* PROGRESS */
.progress-strip {
  display: flex;
  gap: 4px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.progress-dot {
  width: 16px; height: 6px;
  background: var(--bg-elev-2);
  border-radius: 2px;
}
.progress-dot.done { background: var(--pro); }
.progress-dot.partial { background: var(--warn); }

/* TIMER */
.timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--ink-dim);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.timer-dot {
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  display: inline-block;
}

/* AUDIO PLAYER for recordings */
.rec-list {
  margin-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rec-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg);
  border-radius: 6px;
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-dim);
}
.rec-item audio { flex: 1; max-width: 220px; height: 32px; }

/* EMPTY / SETUP */
.welcome-card {
  background: linear-gradient(135deg, rgba(255,120,73,0.08), rgba(79,195,161,0.05));
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 36px;
  text-align: center;
  margin-bottom: 24px;
}
.welcome-card h1 {
  font-family: 'Fraunces', serif;
  font-weight: 800;
  font-size: 32px;
  letter-spacing: -0.02em;
  margin-bottom: 10px;
}
.welcome-card p {
  color: var(--ink-dim);
  margin-bottom: 18px;
  max-width: 540px;
  margin-left: auto;
  margin-right: auto;
}

/* DAY 1-7 vs 8-30 markers */
.ai-expand-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  color: #b39ddb;
  background: rgba(179,157,219,0.1);
  padding: 2px 6px;
  border-radius: 3px;
  margin-left: 8px;
  letter-spacing: 0.08em;
}

.loading {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid var(--ink-mute);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-mute); }
</style>
</head>
<body>
<div class="app">

<header class="top">
  <div class="brand">
    <span>QMC English<span class="dot">.</span></span>
    <span class="sub">30-DAY · SPOKEN · ACCESS-LEVEL</span>
  </div>
  <div class="top-right">
    <span class="timer" id="dayTimer">⏱ <span id="timerText">00:00</span></span>
    <button class="icon-btn" onclick="openSettings()">⚙ Settings</button>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="section-label">30-Day Plan</div>
    <div class="day-list" id="dayList"></div>
  </aside>

  <main class="content" id="content">
    <!-- rendered by JS -->
  </main>
</div>

</div>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h2>Settings</h2>

    <label>Anthropic API Key</label>
    <input type="password" id="apiKey" placeholder="sk-ant-...">
    <div class="hint">Stored only in your browser (localStorage). Never sent anywhere except directly to Anthropic. Get a key at console.anthropic.com.</div>

    <label>Voice (Text-to-Speech)</label>
    <select id="voiceSelect"></select>

    <label>Speech Rate</label>
    <input type="text" id="speechRate" value="0.95">
    <div class="hint">0.8 = slow, 1.0 = normal, 1.2 = fast. Default 0.95 for shadowing.</div>

    <label>Your Name (used in AI roleplay)</label>
    <input type="text" id="userName" placeholder="Wang Lei">

    <div class="modal-actions">
      <button class="btn" onclick="closeSettings()">Close</button>
      <button class="btn primary" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
